name: 'REUSE Compliance Check'
description: "Check your project's REUSE compliance for clear and simple licensing and copyright!"
author: 'Free Software Foundation Europe (FSFE), University of Manchester'
inputs:
  args:
    description: "The arguments to pass to the reuse-tool"
    required: false
    default: ""
  branch:
    description: "The branch or tag to check out the reuse-tool from"
    required: false
    default: "main"
  python-version:
    description: "The version of Python to run the reuse-tool in."
    required: false
    default: "3.12"
  poetry-version:
    description: "The version of Poetry to install the reuse-tool with."
    required: false
    default: "1.3.0"
  copyright-holder:
    description: "The name of the copyright holder"
    required: false
    default: "University of Manchester"
  license:
    description: "The name of the license to apply"
    required: false
    default: "apache-2.0"
  merge:
    description: "Whether to merge copyrights"
    required: false
    default: "true"
  fallback-dot-license:
    description: "Whether to create a .license file as a fallback"
    required: false
    default: "true"
  extra-formats-file:
    description: "The name of the extra formats file"
    required: false
    default: ".extraformats"
  ignore-file:
    description: "The name of the ignore file"
    required: false
    default: ".licenseignore"
  base-dir:
    description: "The base directory to analyse and annotate"
    required: false
    default: "."
runs:
  using: docker
  image: docker://ghcr.io/uomresearchit/reuse-tool:sha256-1a0d5fa9bf09aa994b6f0d9121ee8e07b1626da08150bec360f048207ab93812
  args:
    - bash
    - -c
    - |
      set -e

      export Arguments="${{ inputs.args }}"
      export Who="${{ inputs.copyright-holder }}"
      export License="${{ inputs.license }}"
      export Merge="${{ inputs.merge }}"
      export Fallback="${{ inputs.fallback-dot-license }}"
      export Extra="${{ inputs.extra-formats-file }}"
      export Ignore="${{ inputs.ignore-file }}"
      export Dir="${{ inputs.base-dir }}"

      if [ -f "${GITHUB_ACTION_PATH}/compose-args.bash" ]; then
        source "${GITHUB_ACTION_PATH}/compose-args.bash"
      else
        echo "compose-args.bash not found" >&2
        exit 1
      fi

      IFS=$'\n' arr=( $(xargs -n1 <<<"$Arguments") )
      reuse "${arr[@]}"
