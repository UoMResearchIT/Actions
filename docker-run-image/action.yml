name: Run Docker Image as Container
description: >
  Runs a (local) docker image as a container with a unique container ID.
  Handles shutting down the container at the end of the workflow job.
author: Donal Fellows
branding:
  icon: box
  color: green
inputs:
  image-id:
    description: The image to instantiate in a container.
    required: true
  port:
    description: A port to map from inside the container to outside it.
    required: false
  run-args:
    description: Additional arguments to pass to the 'docker run' command.
    required: false
outputs:
  container-id:
    description: The ID of the running container.
runs:
  using: node24
  main: main.js
  post: main.js
