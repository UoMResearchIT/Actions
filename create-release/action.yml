name: Create Release
author: Josh Woodcock
description: >
  Tags a commit and creates a GitHub release for it, with release notes
  generated from the pull requests merged since the previous release, then
  closes the release's milestone. The version is read from a file in the
  repository, so bumping it is the only manual step. In check mode it instead
  checks, e.g. on a release pull request, that the version has not been
  released already and is newer than the latest release.

  Does not need the repository to be checked out.
branding:
  color: green
  icon: tag

inputs:
  mode:
    description: >
      release to create the release, or check to only check that the version
      can be released.
    required: false
    default: release
  version:
    description: >
      The version to release, e.g. 1.2.3. If empty, it is read from
      version-file.
    required: false
    default: ""
  version-file:
    description: >
      The file holding the version, relative to the repository root. It is
      read at the target commit.
    required: false
    default: ""
  version-pattern:
    description: >
      A JavaScript regular expression that finds the version in version-file;
      its first group, or the whole match if it has no group, is the version.
      If empty, the whole file is the version.
    required: false
    default: ""
  tag:
    description: >
      The tag name, with {version} where the version goes, e.g.
      Release_v{version}. Existing tags of this form are the earlier releases.
    required: false
    default: v{version}
  title:
    description: >
      The release title, with {version} where the version goes. Defaults to
      the tag name.
    required: false
    default: ""
  milestone:
    description: >
      The milestone to close after releasing, with {version} where the version
      goes, e.g. v{version}. It is left open, with a warning, if it still has
      open issues or pull requests. If empty, milestones are not touched.
    required: false
    default: ""
  target:
    description: >
      The commit (SHA or branch) to release. Defaults to the commit that
      triggered the workflow.
    required: false
    default: ""
  if-exists:
    description: >
      What to do in release mode if the tag already exists: skip (succeed
      without releasing) or fail.
    required: false
    default: skip
  require-increase:
    description: >
      Fail if the version is not newer than the latest release. Set to false to
      allow releases of older lines, e.g. a hotfix to 1.2 after 1.3 is out.
    required: false
    default: "true"
  draft:
    description: Create the release as a draft, to be published by hand.
    required: false
    default: "false"
  prerelease:
    description: Mark the release as a pre-release. It is then never the latest.
    required: false
    default: "false"
  latest:
    description: >
      Whether the release becomes the repository's latest release: true, false
      or legacy (decided by date and version).
    required: false
    default: "true"
  token:
    description: The token used to call the GitHub API.
    required: false
    default: ${{ github.token }}

outputs:
  version:
    description: The version, without any leading v.
    value: ${{ steps.release.outputs.version }}
  tag:
    description: The tag name.
    value: ${{ steps.release.outputs.tag }}
  previous-tag:
    description: >
      The tag of the release before this one, or empty if this is the first.
    value: ${{ steps.release.outputs.previous-tag }}
  created:
    description: true if a release was created, otherwise false.
    value: ${{ steps.release.outputs.created }}
  release-url:
    description: The release's web page, if one was created.
    value: ${{ steps.release.outputs.release-url }}

runs:
  using: composite
  steps:
    - name: Create the release
      id: release
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        ACTION_PATH: ${{ github.action_path }}
        RELEASE_MODE: ${{ inputs.mode }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_VERSION_FILE: ${{ inputs.version-file }}
        RELEASE_VERSION_PATTERN: ${{ inputs.version-pattern }}
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_TITLE: ${{ inputs.title }}
        RELEASE_MILESTONE: ${{ inputs.milestone }}
        RELEASE_TARGET: ${{ inputs.target }}
        RELEASE_IF_EXISTS: ${{ inputs.if-exists }}
        RELEASE_REQUIRE_INCREASE: ${{ inputs.require-increase }}
        RELEASE_DRAFT: ${{ inputs.draft }}
        RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        RELEASE_LATEST: ${{ inputs.latest }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const main = require(require("path").join(process.env.ACTION_PATH, "release.js"));
          await main({ github, context, core });
