name: Docker Web Smoke Test
author: Josh Woodcock
description: >
  Builds a Docker image of a web app, starts it, waits until it answers over HTTP, then
  runs either a bundled check (chosen with app-kind) or your own check script.
  Container logs are always printed at the end so failures can be diagnosed.

  Assumes the repository has already been checked out.
branding:
  color: blue
  icon: box

inputs:
  port:
    description: Port the app listens on inside the container. It is published on the same host port.
    required: true
  app-kind:
    description: >
      Run the bundled check for this kind of app: fastapi, flask, shiny,
      static or streamlit.
      Also passed to check-script as APP_KIND if both are given.
    required: false
    default: ""
  check-script:
    description: >
      Your own check script (relative to the repository root) to run once the
      app is up. Takes precedence over the bundled check.
    required: false
    default: ""
  check-env:
    description: >
      Extra environment variables for the check, one KEY=value per line.
      Values may contain spaces.
    required: false
    default: ""
  context:
    description: Docker build context.
    required: false
    default: .
  dockerfile:
    description: Path to the Dockerfile.
    required: false
    default: ./Dockerfile
  build-args:
    description: Build arguments, one KEY=value per line.
    required: false
    default: ""
  image-tag:
    description: Tag for the local image.
    required: false
    default: docker-web-smoke:ci
  cache-scope:
    description: >
      GitHub Actions cache scope for build layers. Give each image its own
      scope if a repository builds more than one.
    required: false
    default: buildkit
  run-args:
    description: >
      Extra arguments for docker run, such as "-e KEY=value". Split on
      whitespace, so values cannot contain spaces.
    required: false
    default: ""
  ready-path:
    description: Path that must respond without an error (status below 400; redirects count) once the app is up.
    required: false
    default: /
  ready-timeout:
    description: Seconds to wait for ready-path to respond.
    required: false
    default: "60"

runs:
  using: composite
  steps:
    - name: Choose a container name
      id: names
      shell: bash
      # Unique per run, so that jobs sharing a Docker daemon (e.g. on a
      # self-hosted runner) cannot clash or remove each other's containers.
      run: echo "container=docker-web-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}${RANDOM}" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Build Docker image
      id: build
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        build-args: ${{ inputs.build-args }}
        load: true
        tags: ${{ inputs.image-tag }}
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        # Smoke builds only need a disposable local image; avoid exporting
        # a large cache blob that can exhaust runner disk space.
        cache-to: type=gha,mode=min,scope=${{ inputs.cache-scope }}

    - name: Start container
      shell: bash
      env:
        CONTAINER_NAME: ${{ steps.names.outputs.container }}
        # The image ID rather than the tag, as another job sharing the Docker
        # daemon may have retagged the image since this build.
        IMAGE_ID: ${{ steps.build.outputs.imageid }}
        PORT: ${{ inputs.port }}
        RUN_ARGS: ${{ inputs.run-args }}
      run: |
        set -euo pipefail
        # RUN_ARGS is left unquoted on purpose so it splits into arguments.
        # shellcheck disable=SC2086
        docker run -d --name "$CONTAINER_NAME" -p "$PORT:$PORT" $RUN_ARGS "$IMAGE_ID"

    - name: Wait for the app to respond
      shell: bash
      env:
        CONTAINER_NAME: ${{ steps.names.outputs.container }}
        BASE_URL: http://127.0.0.1:${{ inputs.port }}
        READY_PATH: ${{ inputs.ready-path }}
        READY_TIMEOUT: ${{ inputs.ready-timeout }}
      run: |
        set -euo pipefail
        # Report failures as an annotation and in the job summary, not only
        # in this step's log.
        fail() {
          echo "::error title=Docker web smoke test::$1"
          echo "### ❌ Docker web smoke test: $1" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        }
        deadline=$((SECONDS + READY_TIMEOUT))
        while true; do
          # Each probe is limited to the time left (at most 10s), so an app
          # that accepts connections but never responds cannot hang the job.
          probe=$((deadline - SECONDS))
          if [ "$probe" -gt 10 ]; then probe=10; fi
          if [ "$probe" -lt 1 ]; then probe=1; fi
          if curl --fail --silent --max-time "$probe" "$BASE_URL$READY_PATH" >/dev/null; then
            break
          fi
          if [ "$(docker inspect -f '{{.State.Running}}' "$CONTAINER_NAME")" != true ]; then
            fail "Container exited before $READY_PATH responded"
          fi
          if [ "$SECONDS" -ge "$deadline" ]; then
            fail "Timed out after ${READY_TIMEOUT}s waiting for $READY_PATH to respond"
          fi
          sleep 2
        done
        echo "Container is responding at $BASE_URL$READY_PATH"

    - name: Run check
      if: inputs.check-script != '' || inputs.app-kind != ''
      shell: bash
      env:
        CONTAINER_NAME: ${{ steps.names.outputs.container }}
        BASE_URL: http://127.0.0.1:${{ inputs.port }}
        APP_KIND: ${{ inputs.app-kind }}
        CHECK_SCRIPT: ${{ inputs.check-script }}
        CHECK_ENV: ${{ inputs.check-env }}
      run: |
        set -euo pipefail
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          case "$line" in
            # ${line?} exports the KEY=value pair itself (quiets SC2163).
            *=*) export "${line?}" ;;
            *) echo "check-env line is not KEY=value: $line" >&2; exit 1 ;;
          esac
        done <<< "$CHECK_ENV"
        if [ -n "$CHECK_SCRIPT" ]; then
          echo "Running $CHECK_SCRIPT"
          bash "$CHECK_SCRIPT"
        else
          echo "Running bundled $APP_KIND check"
          bash "$GITHUB_ACTION_PATH/docker_smoke_check.sh"
        fi

    - name: Show container logs
      if: always()
      shell: bash
      env:
        CONTAINER_NAME: ${{ steps.names.outputs.container }}
      run: docker logs "$CONTAINER_NAME" || true

    - name: Stop container
      if: always()
      shell: bash
      env:
        CONTAINER_NAME: ${{ steps.names.outputs.container }}
      run: docker rm -f "$CONTAINER_NAME" || true
