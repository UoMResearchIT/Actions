name: Enforce License Rules
# Enforces our own license rules.
run-name: License Check
on: push
permissions: {}
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Enforce
        uses: UoMResearchIT/actions/check-copyrights@c62e71b7108986ca2d5c9338fb8f55061b18ac44 # v1.2.7
        with:
          profile: ASL
