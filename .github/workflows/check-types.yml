# Type-checks the JavaScript used by actions, via @ts-check and JSDoc.
# Nothing is compiled; the actions run the checked files directly.

name: Check Types
on:
  push:
    branches: ["main"]
    paths:
      - "create-release/**"
      - ".github/workflows/check-types.yml"
  pull_request:
    paths:
      - "create-release/**"
      - ".github/workflows/check-types.yml"

permissions: {}

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    defaults:
      run:
        working-directory: create-release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install type definitions
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck
