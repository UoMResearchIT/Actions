name: Enforce Handbook Naming Conventions for Branches
description: >
  Checks whether the branch name complies with the Handbook Naming Conventions.

on:
  workflow_call:
    inputs:
      branch:
        type: string
        required: true
        description: >
          The name of the branch. Try the github.head_ref if this is for a pull request.

jobs:
  check-branch-name-conventions:
    if: ${{ !startsWith(inputs.branch, 'dependabot/') }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check branch name
        run: |
          if [[ ! "$BRANCH" =~ ^(copilot\/)?[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error title=Bad Branch Name::Branch name '$BRANCH' does not follow the naming convention established in the RSE Agile Method Handbook."
            exit 1
          fi
        env:
          BRANCH: ${{ inputs.branch }}
