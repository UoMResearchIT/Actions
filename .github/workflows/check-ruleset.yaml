name: Check Repository Ruleset

on:
  workflow_call:
    inputs:
      bot-id:
        description: >
          Deprecated and ignored; the standard ruleset no longer needs a token
          to read it. Accepted so that existing callers keep working.
        type: string
        required: false
        default: ''
      standard-owner:
        description: >
          Deprecated. Only the default (UoMResearchIT) is supported; the
          standard ruleset is now read from this repository.
        type: string
        default: UoMResearchIT
        required: false
      standard-repo:
        description: >
          Deprecated. Only the default (RSE-Repository-Template) is supported;
          the standard ruleset is now read from this repository.
        type: string
        default: RSE-Repository-Template
        required: false
      ignore:
        description: JSON array of parameter paths to ignore
        type: string
        required: false
        default: '[]'
    secrets:
      bot-key:
        description: >
          Deprecated and ignored; the standard ruleset no longer needs a token
          to read it. Accepted so that existing callers keep working.
        required: false

jobs:
  check-ruleset:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'dependabot/') }}
    name: Compare Ruleset Against Standard
    permissions:
      contents: read

    steps:
      - name: Reject unsupported standard repository
        if: inputs.standard-owner != 'UoMResearchIT' || inputs.standard-repo != 'RSE-Repository-Template'
        shell: bash
        run: |
          echo "::error title=Unsupported Standard::Checking against $STANDARD is no longer supported. The standard ruleset is now read from .github/standard-ruleset/ruleset.json in UoMResearchIT/actions; remove the standard-owner and standard-repo inputs."
          exit 1
        env:
          STANDARD: ${{ inputs.standard-owner }}/${{ inputs.standard-repo }}

      - name: Note unused credentials
        if: inputs.bot-id != ''
        shell: bash
        run: |
          echo "::notice title=Unused Input::The bot-id input and bot-key secret are no longer needed by check-ruleset and can be removed from the calling workflow."

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 1

      - name: Fetch Standard Ruleset
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .standard-ruleset
          sparse-checkout: .github/standard-ruleset/ruleset.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
        timeout-minutes: 1

      - name: Fetch This Repository's Ruleset
        id: current
        uses: UoMResearchIT/actions/get-repo-ruleset@c62e71b7108986ca2d5c9338fb8f55061b18ac44 # v1.2.7
        timeout-minutes: 1

      - name: Check Inclusion of Standard Ruleset in Current Ruleset
        uses: UoMResearchIT/actions/check-ruleset-containment@c62e71b7108986ca2d5c9338fb8f55061b18ac44 # v1.2.7
        with:
          current: ${{ steps.current.outputs.filename }}
          expected: .standard-ruleset/.github/standard-ruleset/ruleset.json
          ignore: ${{ inputs.ignore }}
        timeout-minutes: 1
