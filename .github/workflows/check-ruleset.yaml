# GitHub Actions Workflow: Check Repository Ruleset
#
# This workflow ensures that the repository's branch protection rules
# contain the standard ruleset published in this repository at
# .github/standard-ruleset/ruleset.json (a public copy of the rules defined
# by the RSE-Repository-Template repository).
#
# Steps:
# 1. Fetch the standard ruleset from the same commit as this workflow.
# 2. Fetch the current repository's Branch Protection Rulesets.
# 3. Compare the expected and actual rulesets.
#
# No extra credentials are needed, so this works in any organisation.

