# Runs docker-compose-web-smoke-test against the Wagtail-And-Django-Stack
# template, with the inputs its README documents. Runs weekly, so that a
# change to the template that breaks the action (or the documented inputs)
# is caught, and on changes to the action or its shared check script.

name: Test Docker Compose Web Smoke Test

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - docker-compose-web-smoke-test/**
      - docker-web-smoke-test/docker_smoke_check.sh
      - .github/workflows/test-docker-compose-web-smoke-test.yml

permissions: {}

jobs:
  wads-template:
    name: Wagtail-And-Django-Stack template
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout the template
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UoMResearchIT/Wagtail-And-Django-Stack
          path: wads
          persist-credentials: false

      - name: Smoke test
        uses: ./docker-compose-web-smoke-test
        with:
          working-directory: wads
          base-url: https://localhost
          insecure-tls: true
          ready-path: /healthz/
          app-kind: wagtail
          app-service: django
          env-template: .env.dist.template
          env-values: |
            DJANGO_USER=${RUNNER_UID}
            DJANGO_GROUP=${RUNNER_GID}
            WADS_CONTAINER_PREFIX=smoke
            WADS_SITE_URL=localhost
          setup-commands: |
            django: python manage.py makemigrations --no-input && python manage.py migrate --no-input
            django: python manage.py collectstatic --no-input
          check-env: |
            HEALTH_PATH=/healthz/
          reclaim-disk: true
